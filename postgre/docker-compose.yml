services:
  postgre:
    image: postgres:latest
    container_name: my_postgres
    restart: always
    env_file:
      - .env
    networks:
    - postgres-network
    ports:
      - "5432:5432"
    volumes:
      - ${PWD}/postgres_data:/var/lib/postgresql
    user: root

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 15433:80
    env_file:
      - .env
    depends_on:
      - postgre
    networks:
      - postgres-network
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin

networks:
  postgres-network:
    driver: bridge
